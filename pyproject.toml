# SPDX-License-Identifier: MIT

[project]
name = "crystalsweep"
dynamic = ["version"]
authors = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
maintainers = [ {name = "Christofanis Skordas", email = "skordasc@uchicago.edu"} ]
description = "Beamline control and data acquisition software for single-crystal X-ray diffraction experiments."
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE.txt"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
requires-python = "==3.14.*"
dependencies = [
    "h5py>=3.16.0",
    "numpy>=2.5.4",
    "p4p>=4.3.0",
    "fabio>=2026.6.0",
    "pillow>=12.3.0",
    "pyfai>=2026.9.0",
    "pyopengl>=3.1.10",
    "pyopengl-accelerate>=3.1.10",
    "pydantic>=2.14.1",
    "tomli-w>=1.2.0",
    "vispy>=0.17.0",
    "wxpython>=4.3.1",
    "lz4>=4.4.5",
    "blosc>=1.11.4",
    "bitshuffle>=0.5.2",
    "pyepics>=3.5.10",
    "pyautomation>=0.0.1",
    "newportxps>=2026.1.1",
    "cryio>=2018.5.30",
    "wxmplot>=2026.2.3",
    "wxutils>=2026.3.0",
    "pyshortcuts>=1.9.11",
    "epicsapps",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.86",
]
docs = [
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
]

[project.scripts]
crystalsweep = "crystalsweep:main"

[project.urls]
Homepage = "https://github.com/gsecars/crystalsweep"
Issues = "https://github.com/gsecars/crystalsweep/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crystalsweep"]
include = ["crystalsweep/assets/*.png", "crystalsweep/assets/*.svg"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
exclude = [
    ".eggs",
    ".git",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
]
line-length = 160
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
