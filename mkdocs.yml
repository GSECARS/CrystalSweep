site_name: CrystalSweep
site_description: Beamline control and data acquisition software for single-crystal X-ray diffraction experiments.
site_author: Christofanis Skordas
site_url: https://gsecars.github.io/CrystalSweep/
repo_url: https://github.com/GSECARS/CrystalSweep
repo_name: GSECARS/CrystalSweep

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - API Reference:
    - paths: api/paths.md
    - Model:
      - Collection: api/model/collection.md
      - Scan: api/model/scan.md
      - Detector: api/model/detector.md
      - EPICS: api/model/epics.md
      - Integration: api/model/integration.md
      - Hardware Controllers: api/model/hardware.md
      - File & Settings: api/model/settings.md
      - Utilities: api/model/utilities.md
    - UI:
      - Controllers: api/ui/controllers.md
      - Views: api/ui/views.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
